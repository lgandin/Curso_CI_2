name: Teste de Carga

on:
  workflow_call:

jobs:
  teste_de_carga:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1
      #infra como codigo
    - name: Clonando repo do github
      run: git clone  https://github.com/leollo98/Infra_ci   
    
    - name: HashiCorp - Setup Terraform
      uses: hashicorp/setup-terraform@v2.0.3
      with:
        # The version of Terraform CLI to install. Instead of full version string you can also specify constraint string starting with "<" (for example `<1.13.0`) to install the latest version satisfying the constraint. A value of `latest` will install the latest version of Terraform CLI. Defaults to `latest`.
        terraform_version: latest
    
    - name: config do terraform
      run: terraform -chdir=Infra_ci/env/Homolog/ init
     
    - name: destroy terraform pois ele ja iniciou com o comando acima com o init
      run: terraform -chdir=Infra_ci/env/Homolog/ destroy -auto-approve
      
    - name: config do terraform >>>> AWS
      run: terraform -chdir=Infra_ci/env/Homolog/ apply -auto-approve

    - name: pegar a saida dos comandos acima
      run: echo "$(terraform -chdir=Infra_ci/env/Homolog/ output -raw IP_alb)"

    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
         python-version: '3.10'
  
    - name: Instalar dependências
      run: |
         python -m pip install --upgrade pip
         pip install locust
         
    - name: Executar Locust
      run: | 
        echo "from locust import HttpUser, TaskSet, task, between" >> locustfile.py
        echo "" >> locustfile.py
        echo "class UserTasks(TaskSet):" >> locustfile.py
        echo "	@task(1)" >> locustfile.py
        echo "	def index(self):" >> locustfile.py
        echo "		self.client.get("/bruno")" >> locustfile.py
        echo "" >> locustfile.py
        echo "class WebsiteUser(HttpUser):" >> locustfile.py
        echo "	tasks = [UserTasks]" >> locustfile.py
        echo "  wait_time = between(1, 5)" >> locustfile.py
        



          
          
