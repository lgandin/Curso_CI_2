name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: root

    strategy:
      matrix:
        go_version: ['1.17', '1.18']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go_version }}

      - name: Wait for database
        run: sleep 10

      - name: Test
        run: go test ./... -v


  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: go build -v main.go
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          # Artifact name
          name: artefato_go
          # A file, directory or wildcard pattern that describes what to upload
          path: main
          # The desired behavior if no files are found using the provided path.
                
  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit
    
  #deploy-ec2:
    #needs: build
    #uses: ./.github/workflows/EC2.yml
    #secrets: inherit
    
  deploy-ecs:
    needs: docker
    uses: ./.github/workflows/ECS.yml
    secrets: inherit
